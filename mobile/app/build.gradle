plugins { id 'com.android.application' }
android {
    namespace 'org.eyepqc.mobile'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig { applicationId 'org.eyepqc.mobile'; minSdk 26; targetSdk 35; versionCode 3; versionName '0.3' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    packaging { resources.excludes += ['META-INF/versions/**', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.81'
    implementation 'com.google.code.gson:gson:2.11.0'
}
