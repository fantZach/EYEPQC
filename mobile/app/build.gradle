plugins { id 'com.android.application' }

def signingNames = ['EYEPQC_ANDROID_KEYSTORE', 'EYEPQC_ANDROID_KEY_ALIAS', 'EYEPQC_ANDROID_STORE_PASSWORD', 'EYEPQC_ANDROID_KEY_PASSWORD']
def signingValues = signingNames.collect { System.getenv(it) }
if (signingValues.any { it } && !signingValues.every { it }) {
    throw new GradleException('Release signing requires all four EYEPQC_ANDROID_* environment values; no debug-key fallback.')
}
def releaseSigned = signingValues.every { it }
if (releaseSigned && !new File(signingValues[0]).isFile()) {
    throw new GradleException('Release keystore file is missing.')
}
def deploymentCa = providers.gradleProperty('eyepqcTrustCaFile').orNull
def deploymentCaBytes = null
def generatedTrust = layout.buildDirectory.dir('generated/deploymentTrust')
if (deploymentCa != null) {
    def input = new File(deploymentCa)
    if (!input.isAbsolute() || !input.isFile()) throw new GradleException('Deployment CA must be an existing absolute public PEM file.')
    def bytes = input.bytes
    def pem = new String(bytes, java.nio.charset.StandardCharsets.US_ASCII)
    if (bytes.length > 16384 || !(pem ==~ /(?s)\s*-----BEGIN CERTIFICATE-----[A-Za-z0-9+\/=\r\n]+-----END CERTIFICATE-----\s*/)) {
        throw new GradleException('Deployment CA must contain exactly one public PEM certificate, never a private key.')
    }
    try {
        def factory = java.security.cert.CertificateFactory.getInstance('X.509')
        def cert = factory.generateCertificate(new ByteArrayInputStream(bytes))
        cert.checkValidity()
        if (cert.basicConstraints < 0 || (cert.keyUsage != null && !cert.keyUsage[5])) throw new Exception('not a CA')
        def debugCert = file('src/debug/res/raw/eyepqc_test_ca.pem').withInputStream { factory.generateCertificate(it) }
        if (java.util.Arrays.equals(cert.encoded, debugCert.encoded)) throw new Exception('debug CA')
    } catch (Exception ignored) {
        throw new GradleException('Deployment CA is expired, not a signing CA, invalid, or the old debug CA; supply an independently managed deployment CA.')
    }
    deploymentCaBytes = bytes
}

def prepareTrust = tasks.register('prepareDeploymentTrust') {
    if (deploymentCa != null) inputs.file(deploymentCa)
    outputs.dir(generatedTrust)
    doLast {
        if (deploymentCa != null) {
            def root = generatedTrust.get().asFile
            new File(root, 'res/raw').mkdirs()
            new File(root, 'res/xml').mkdirs()
            new File(root, 'res/raw/eyepqc_deployment_ca.pem').bytes = deploymentCaBytes
            new File(root, 'res/xml/eyepqc_release_network_security.xml').text = '''<network-security-config>
    <base-config cleartextTrafficPermitted="false"><trust-anchors>
        <certificates src="system" /><certificates src="@raw/eyepqc_deployment_ca" overridePins="false" />
    </trust-anchors></base-config>
</network-security-config>
'''
            new File(root, 'AndroidManifest.xml').text = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">
    <application android:usesCleartextTraffic="false" tools:replace="android:usesCleartextTraffic" android:networkSecurityConfig="@xml/eyepqc_release_network_security" />
</manifest>
'''
        }
    }
}
android {
    namespace 'org.eyepqc.mobile'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig { applicationId 'org.eyepqc.mobile'; minSdk 26; targetSdk 35; versionCode 9; versionName '0.9.0-rc1' }
    signingConfigs {
        if (releaseSigned) {
            deployment {
                storeFile new File(signingValues[0])
                keyAlias signingValues[1]
                storePassword signingValues[2]
                keyPassword signingValues[3]
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            if (releaseSigned) signingConfig signingConfigs.deployment
        }
    }
    if (deploymentCa != null) {
        sourceSets.release.manifest.srcFile generatedTrust.map { new File(it.asFile, 'AndroidManifest.xml') }
        sourceSets.release.res.srcDir generatedTrust.map { new File(it.asFile, 'res') }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    packaging { resources.excludes += ['META-INF/versions/**', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn prepareTrust }
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.81'
    implementation 'com.google.code.gson:gson:2.11.0'
}
