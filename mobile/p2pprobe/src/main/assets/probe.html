<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EYEPQC P2P测试</title>
<style>body{font:16px sans-serif;padding:12px}textarea,input{box-sizing:border-box;width:100%;margin:8px 0}textarea{height:120px}button{padding:12px;margin:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h2>P2P 连通与吞吐测试</h2><p>仅合成数据，不是摄像头视频。保持页面在前台；没有 TURN 兜底。offer/answer 仅交给自己的 PC，不公开发送。</p>
<label>STUN <input id="stun" value="stun:stun.cloudflare.com:3478"></label>
<label>粘贴 PC 的 offer.json<textarea id="offer" spellcheck="false"></textarea></label>
<button id="connect">生成 answer</button><button id="close">关闭</button>
<label>将完整 answer 保存为 PC 的 answer.json<textarea id="answer" readonly spellcheck="false"></textarea></label>
<pre id="status">等待 offer；手机使用移动网络，关闭 Wi-Fi。</pre>
<script>
'use strict';
let pc=null, dc=null, statsTimer=null, received=0, first=0, last=0, failed=false, generation=0;
const status=document.getElementById('status');
function show(text){status.textContent=text;}
function close(){generation++;if(statsTimer)clearInterval(statsTimer);statsTimer=null;if(dc)dc.close();dc=null;if(pc)pc.close();pc=null;}
function fail(text){failed=true;close();show('FAIL: '+text);}
function parseOffer(text){
 if(new TextEncoder().encode(text).length>65536)throw Error('offer 过大');
 const v=JSON.parse(text);
 if(!v||Object.keys(v).sort().join(',')!=='sdp,type'||v.type!=='offer'||typeof v.sdp!=='string'||!v.sdp.startsWith('v=0\r\n'))throw Error('offer 格式');
 const media=v.sdp.split(/\r?\n/).filter(x=>x.startsWith('m='));
 if(media.length!==1||!media[0].startsWith('m=application ')||v.sdp.includes(' typ relay'))throw Error('仅允许 datachannel，无中继');
 return v;
}
function checkPacket(buffer,index){
 if(!(buffer instanceof ArrayBuffer)||buffer.byteLength!==1459)throw Error('数据长度');
 const view=new DataView(buffer);if(view.getUint32(0)!==index)throw Error('序号');
 const bytes=new Uint8Array(buffer);for(let i=4;i<bytes.length;i++)if(bytes[i]!==index%251)throw Error('负载校验');
}
function ack(){const b=new ArrayBuffer(4);new DataView(b).setUint32(0,received);dc.send(b);}
async function selectedPair(){
 if(!pc)return '';
 const report=await pc.getStats();let pair;
 report.forEach(s=>{if(s.type==='transport'&&s.selectedCandidatePairId)pair=report.get(s.selectedCandidatePairId);});
 if(!pair)report.forEach(s=>{if(s.type==='candidate-pair'&&s.state==='succeeded'&&s.nominated)pair=s;});
 if(!pair)return '选中路径尚无统计';
 const local=report.get(pair.localCandidateId),remote=report.get(pair.remoteCandidateId);
 if(!local||!remote)return '候选统计不完整';
 if(local.candidateType==='relay'||remote.candidateType==='relay')throw Error('意外中继');
 return '选中路径 '+local.candidateType+' / '+remote.candidateType+'，'+local.protocol+'；未配置 TURN';
}
document.getElementById('close').onclick=()=>{close();show('已关闭');};
document.getElementById('connect').onclick=async()=>{
 close();failed=false;received=0;first=last=0;document.getElementById('answer').value='';
 const token=generation;
 try{
  if(typeof RTCPeerConnection==='undefined')throw Error('当前 Android System WebView 不支持 WebRTC，请更新 WebView');
  const offer=parseOffer(document.getElementById('offer').value),stun=document.getElementById('stun').value.trim();
  if(stun!=='none'&&!/^stun:[A-Za-z0-9.-]+:\d+$/.test(stun))throw Error('只允许 STUN 或 none');
  pc=new RTCPeerConnection({iceServers:stun==='none'?[]:[{urls:stun}]});const active=pc;
  pc.onconnectionstatechange=()=>{if(pc!==active)return;if(pc.connectionState==='failed')fail('ICE/DTLS 连接失败');else if(!received)show('连接状态 '+pc.connectionState);};
  pc.ondatachannel=e=>{
   if(pc!==active)return;
   if(dc||e.channel.label!=='eyepqc-probe'||!e.channel.ordered||e.channel.maxRetransmits!==null||e.channel.maxPacketLifeTime!==null){e.channel.close();fail('错误的数据通道');return;}
   dc=e.channel;dc.binaryType='arraybuffer';
   dc.onmessage=async e=>{
    if(pc!==active||failed)return;
    try{
     if(typeof e.data==='string'){
      if(!/^END:[1-9][0-9]*$/.test(e.data)||Number(e.data.slice(4))!==received)throw Error('结束计数');
      const path=await selectedPair();if(pc!==active)return;ack();dc.send('DONE');
      if(statsTimer)clearInterval(statsTimer);statsTimer=null;
      show('接收校验完成 '+received+' 包 / '+(received*1459)+' 字节\n接收窗口 '+((last-first)/1000).toFixed(2)+' 秒，约 '+((received-1)*1459*8/Math.max(1,last-first)/1000).toFixed(2)+' Mbps\n'+path+'\n请以 PC result.json 判断完整测试结果。');
     }else{checkPacket(e.data,received);const now=performance.now();if(!received)first=now;last=now;received++;if(received%32===0)ack();}
    }catch(error){if(pc===active)fail(error.message);}
   };
   dc.onopen=()=>{if(pc!==active)return;show('DataChannel 已打开，等待合成负载');statsTimer=setInterval(()=>show('已校验 '+received+' 包'),1000);};
   dc.onclose=()=>{if(pc!==active)return;if(statsTimer)clearInterval(statsTimer);statsTimer=null;};
  };
  await pc.setRemoteDescription(offer);await pc.setLocalDescription(await pc.createAnswer());
  await new Promise((resolve,reject)=>{if(active.iceGatheringState==='complete')return resolve();const timer=setTimeout(()=>{active.removeEventListener('icegatheringstatechange',changed);reject(Error('ICE 收集超时'));},30000);function changed(){if(active.iceGatheringState==='complete'){clearTimeout(timer);active.removeEventListener('icegatheringstatechange',changed);resolve();}}active.addEventListener('icegatheringstatechange',changed);});
  if(pc!==active)return;
  document.getElementById('answer').value=JSON.stringify({type:pc.localDescription.type,sdp:pc.localDescription.sdp});show('answer 已生成，完整复制回 PC；请保持此页面在前台。');
 }catch(error){if(token===generation)fail(error.message);}
};
</script></html>
